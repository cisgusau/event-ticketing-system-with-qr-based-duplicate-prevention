{% extends 'base.html' %}
{% block title %}Order confirmation{% endblock %}
{% block content %}
<h1>Demo order confirmed</h1>
<p>Reference: {{ order.reference }}</p>
<p>Buyer: {{ order.buyer_name }} ({{ order.buyer_email }})</p>
{% for ticket in tickets %}
  <div>
    <img src="{{ ticket.qr }}" alt="Ticket QR">
    <p>{{ ticket.attendee_name }}</p>
  </div>
{% endfor %}
{% endblock %}
